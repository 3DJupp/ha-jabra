name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version custom_components/jabra/manifest.json)
          project=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "tag=$tag manifest=$manifest pyproject=$project"
          test "$tag" = "$manifest" && test "$tag" = "$project"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
