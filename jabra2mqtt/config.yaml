name: Jabra to MQTT
version: "0.1.0"
slug: jabra2mqtt
description: Battery, busylight and settings of Jabra headsets in Home Assistant, via MQTT
url: https://github.com/3DJupp/ha-jabra
image: ghcr.io/3djupp/ha-jabra-{arch}
arch:
  - amd64
  - aarch64
init: false
startup: services
services:
  - mqtt:need
# jabridge talks to the headset through /dev/hidrawN and /sys/class/hidraw.
# A static `devices:` list would break container creation when a node is missing,
# so the add-on asks for full device access until a narrower mapping is verified
# on real Home Assistant OS hardware (see docs/HARDWARE_TESTING.md).
full_access: true
udev: true
options:
  allow_writes: true
  busylight_allow_auto: false
  poll_interval: 60
  settings_interval: 300
  base_topic: jabra2mqtt
  log_level: info
schema:
  allow_writes: bool
  busylight_allow_auto: bool
  poll_interval: int(5,3600)
  settings_interval: int(5,86400)
  base_topic: str
  device_serial: str?
  socket_path: str?
  log_level: list(debug|info|warning|error)
