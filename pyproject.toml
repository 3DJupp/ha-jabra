[project]
name = "ha-jabra"
version = "0.2.0"
description = "Home Assistant integration for Jabra headsets over Bluetooth LE"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component",
  "ruff",
  "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
known-third-party = ["homeassistant"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.14"
files = ["custom_components/jabra"]
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
