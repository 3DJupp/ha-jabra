[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jabra2mqtt"
version = "0.1.0"
description = "Bridge between a jabridge service (Jabra headsets on Linux) and Home Assistant via MQTT discovery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["aiomqtt>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "amqtt>=0.11"]

[project.scripts]
jabra2mqtt = "jabra2mqtt.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
# Per-request timeouts are an intentional part of the RPC client API.
ignore = ["ASYNC109"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
